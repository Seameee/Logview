name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]

# 顶层只给读取代码的权限。
# 发布步骤（仅 main/tag）在自己的 job 里单独申请 packages: write，
# 来自 fork 的 PR 因此拿不到发布凭据。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.27.3'
  NODE_VERSION: '24.20.0'

jobs:
  # 验证：PR 与 push 都跑，不接触 registry。
  verify:
    name: 前端与 Go 验证
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖（可复现）
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: 前端类型检查与生产构建
        working-directory: web
        run: npm run build

      - name: 前端纯逻辑测试
        working-directory: web
        run: npm test

      - name: 同步前端产物到 Go embed 目录
        run: |
          rm -rf internal/server/dist
          mkdir -p internal/server/dist
          cp -R web/dist/. internal/server/dist/
          test -f internal/server/dist/index.html

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "以下文件未按 gofmt 格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

  # 镜像构建：PR 只 build 到本地（不推送），用于证明 Dockerfile 在三个架构下都能构建。
  image:
    name: 镜像构建（不推送）
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build（amd64，加载到本地以检查入口）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: logview:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: 检查镜像基本属性
        run: |
          set -eu
          docker image inspect logview:ci --format '{{.Config.User}}' | grep -qx '10001:10001'
          docker image inspect logview:ci --format '{{json .Config.Entrypoint}}' | grep -q '/usr/local/bin/logview'
          docker image inspect logview:ci --format '{{json .Config.ExposedPorts}}' | grep -q '7681/tcp'
          # 运行镜像里不应残留旧的终端实现依赖。
          for bin in node npm ttyd ccze tmux perl; do
            if docker run --rm --entrypoint /bin/sh logview:ci -c "command -v $bin" >/dev/null 2>&1; then
              echo "运行镜像意外包含 $bin"
              exit 1
            fi
          done
          # 内嵌前端产物应能启动并响应 healthz（日志文件缺失属可恢复的源状态，不影响进程存活）。
          cid=$(docker run -d --read-only --tmpfs /tmp:noexec,nosuid,size=16m logview:ci)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 40); do
            if docker exec "$cid" wget -q -O - http://127.0.0.1:7681/healthz 2>/dev/null | grep -q '"status":"ok"'; then
              echo "healthz OK"
              exit 0
            fi
            sleep 0.5
          done
          echo "healthz 未在预期时间内就绪"
          docker logs "$cid" || true
          exit 1

      - name: Build（三架构，仅验证可构建）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          cache-from: type=gha,scope=multiarch
          cache-to: type=gha,mode=max,scope=multiarch

  # 发布：只在 main 或 v* 标签的 push 时运行，且只有这个 job 拥有 packages: write。
  publish:
    name: 发布到 GHCR
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像名沿用 ghcr.io/<owner>/<repo> 的小写形式。
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=multiarch
          cache-to: type=gha,mode=max,scope=multiarch
